<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Fixture — Basic HTML Form</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    label { display: block; margin-top: 16px; font-weight: 500; }
    input, textarea, select { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 24px; padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Job Application — Basic Form</h1>
  <p>This fixture is used by Playwright tests to verify ArziBaaz form detection and autofill.</p>

  <form id="job-application-form">
    <label for="first-name">First Name *</label>
    <input type="text" id="first-name" name="firstName" required placeholder="Enter your first name" />

    <label for="last-name">Last Name *</label>
    <input type="text" id="last-name" name="lastName" required placeholder="Enter your last name" />

    <label for="email">Email Address *</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com" />

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="+91 9876543210" />

    <label for="linkedin">LinkedIn Profile URL</label>
    <input type="url" id="linkedin" name="linkedinUrl" placeholder="https://linkedin.com/in/yourprofile" />

    <label for="github">GitHub Profile URL</label>
    <input type="url" id="github" name="githubUrl" placeholder="https://github.com/yourusername" />

    <label for="location">Current Location</label>
    <input type="text" id="location" name="location" placeholder="City, Country" />

    <label for="experience">Total Years of Experience</label>
    <input type="number" id="experience" name="totalExperience" min="0" max="50" />

    <label for="notice-period">Notice Period</label>
    <select id="notice-period" name="noticePeriod">
      <option value="">Select...</option>
      <option value="immediate">Immediate</option>
      <option value="15days">15 days</option>
      <option value="30days">30 days</option>
      <option value="60days">60 days</option>
      <option value="90days">90 days</option>
    </select>

    <label for="cover-letter">Tell us about yourself *</label>
    <textarea id="cover-letter" name="coverLetter" rows="6" required placeholder="Briefly describe your professional background..."></textarea>

    <label for="why-role">Why are you a good fit for this role?</label>
    <textarea id="why-role" name="whyRole" rows="6" placeholder="Describe why you're a great fit..."></textarea>

    <button type="submit">Submit Application</button>
  </form>

  <script>
    // Prevent actual submission in test fixture
    document.getElementById('job-application-form').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('Form submission is disabled in this test fixture.');
    });
  </script>
</body>
</html>
