name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@11.7.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm --filter @arzi-baaz/contracts build

      - name: API type-check and build
        run: |
          pnpm --filter @arzi-baaz/api exec tsc --noEmit
          pnpm --filter @arzi-baaz/api build

      # The dev build uses environment.ts; the production build is deliberately blocked
      # until real values are set in environment.prod.ts.
      - name: Extension type-check and build
        run: |
          pnpm --filter @arzi-baaz/extension exec tsc --noEmit
          pnpm --filter @arzi-baaz/extension build:dev

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
